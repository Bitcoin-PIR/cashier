# bpir-cashier configuration. Copy to /etc/bitcoinpir/cashier/config.toml.
listen = "127.0.0.1:8095"

# 32-byte Ed25519 seed from `bpir-cashier keygen` (or `bpir-admin keygen`).
grant_key_path = "/etc/bitcoinpir/cashier/grant.key"
# 64-byte seed from `bpir-cashier wallet-seed`. Back it up: it recovers the ecash.
wallet_seed_path = "/etc/bitcoinpir/cashier/wallet.seed"
wallet_db_path = "/var/lib/bitcoinpir-cashier/wallet.sqlite"
# Append-only audit/idempotency log.
store_path = "/var/lib/bitcoinpir-cashier/grants.jsonl"

# Mints whose ecash is accepted; the browser buys from the first one.
mints = ["https://mint.example"]

# Lifetime stamped on grants (max 30 days minus 5 minutes skew).
grant_ttl_secs = 86400

# Browser origins allowed by CORS (empty = any origin; no cookies are used).
cors_origins = ["https://www.bitcoinpir.org", "https://bitcoinpir.org"]

[[offers]]
credits = 1000
amount = 210
unit = "sat"

# Prices the PIR servers enforce (mirror their flags; informational for clients).
[costs]
frame = 1
harmony_hint_set = 150

# Credits contract (docs/CREDITS.md in the main repository), published in
# GET /v2/info and used to turn redeemed sats into gas. Defaults shown.
[gas]
credit_sat = 10
gas_per_credit = 72000
base_gas_per_frame = 20
egress_gas_per_mb = 1000

# Operator identity keys (64 hex) whose certified PIR servers may call
# POST /v2/redeem. Empty refuses every server.
operator_pubkeys = []
# Tolerated clock difference of a redeem request (seconds).
redeem_max_skew_secs = 300
# Redemption log (replay index + settlement ledger); default: redeem.jsonl next to store_path.
# redeem_store_path = "/var/lib/bitcoinpir-cashier/redeem.jsonl"

# ARC credentials (docs/CREDITS.md): one credential = presentation_limit
# presentations, one credit each. Omit the whole table to sell none.
[arc]
# 32-byte master seed from `bpir-cashier arc-seed`; every epoch's issuer keys
# derive from it. Back it up: it is the credentials.
seed_path = "/etc/bitcoinpir/cashier/arc.seed"
epoch_secs = 7776000        # 90 days; credentials are issued under the current epoch
grace_secs = 2592000        # 30 days after an epoch ends its credentials still spend
presentation_limit = 100
[[arc.credential_offers]]   # credits must equal presentation_limit
credits = 100
sat = 1000

# Worst-case prices shown to clients in GET /v2/info (informational). Defaults shown.
[[rate_card]]
flow = "onion_single_address"
credits = 10
[[rate_card]]
flow = "harmony_fresh_client"
credits = 5
[[rate_card]]
flow = "dpf_single_address"
credits = 2
[[rate_card]]
flow = "oram_single_address"
credits = 1

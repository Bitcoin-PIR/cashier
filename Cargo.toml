[package]
name = "bpir-cashier"
version = "0.1.0"
edition = "2021"
authors = ["Bitcoin PIR contributors"]
description = "BitcoinPIR cashier: sells Ed25519 session grants for Cashu ecash (docs/CASHIER_API.md in Bitcoin-PIR/Bitcoin-PIR)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/cashier"
publish = false

[[bin]]
name = "bpir-cashier"
path = "src/main.rs"

[dependencies]
# Grant format, signing, and verification — the same crate the PIR servers use.
pir-session-grant = { git = "https://github.com/Bitcoin-PIR/Bitcoin-PIR.git", rev = "9433842f535482707546fa8b9a82682808d916be" }
# Credits contract (gas parameters, /v2/redeem and /v2/info types, signing
# preimages) and the identity certificate a redeeming server presents; the
# same revision the PIR servers build from.
pir-credit = { git = "https://github.com/Bitcoin-PIR/Bitcoin-PIR.git", rev = "610250714cbe73a3c38733f2c44d4bdc2caff93a" }
pir-identity = { git = "https://github.com/Bitcoin-PIR/Bitcoin-PIR.git", rev = "610250714cbe73a3c38733f2c44d4bdc2caff93a" }
# Verifies server identity certificates and request signatures; signs
# redeem answers.
ed25519-dalek = "2"
# Cashu wallet (token parsing + swap/receive at the mint) and its SQLite store.
cdk = { version = "0.18", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.18", default-features = false, features = ["wallet"] }
# HTTP.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
# Serialization and config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Crypto helpers.
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
# BIP39 phrase generation for the mint seed file (`bpir-cashier mnemonic`).
bip39 = { version = "2", default-features = false, features = ["rand", "std"] }
# Operations.
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "debuginfo"
